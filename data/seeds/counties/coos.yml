# Hand-curated organizations for the Coos County collection.
#
# Researched 2026-10-12. Topics are limited to DSV, housing and maternal health.
#
# `notes` is used as the Services_Summary / Org_Agency_Bio fallback when no
# mission can be extracted, so it must read as a public description of the
# organization. Research caveats and provenance live in YAML comments instead.
#
# verification_status values used here:
#   web_verified  name, website and contact details were each confirmed against
#                 at least two independent public sources (the org's own site,
#                 IRS filings, local news, or a state directory).
#   unverified    included, but at least one material fact rests on a single
#                 source or could not be confirmed; see the comment above the
#                 entry.
#
# Fields are omitted rather than guessed.
#
# Considered and deliberately excluded:
#   - Coast Community Health Center (Bandon FQHC): coastcommunityhealth.org now
#     resolves to a stub pointing at adaptoregon.org, and its Medicare FQHC
#     certification (CCN 381009) is recorded as terminated 2025-09-30 for
#     "merger or closure". It issued a closure notice in January 2025, rescinded
#     it, and transitioned clinic operations to Adapt Integrated Health Care
#     (Douglas County). No longer a separate Coos-County organization.
#   - Adapt Integrated Health Care: behavioral health / substance use, and
#     headquartered in Douglas County.
#   - Bay Clinic, LLP (Coos Bay): runs "the NEST", the postpartum and newborn
#     follow-up program created after Bay Area Hospital ended its MOMS program
#     in February 2025. Topically central, but it is a for-profit physician
#     partnership and none of the allowed org_type values fit it.
#   - CASA of Coos and Curry Counties: child advocacy, out of topic. Also note
#     that the ORCCA board ended its oversight of CASA on 2026-10-09 and the
#     program's services paused pending a new fiscal agent.
#   - Bay Area First Step (North Bend): transitional and permanent housing, but
#     as part of an alcohol-and-drug recovery program.
#   - Kids' HOPE Center (Bay Area Hospital): child abuse intervention.
#   - Coos Health & Wellness behavioral health, ADAPT, NAMI: general behavioral
#     health.
#   - Oregon Law Center, Coos Bay (455 S 4th St): general legal aid. It co-hosts
#     monthly legal clinics for DSV survivors with The SAFE Project and does
#     tenant work, but it is a statewide legal-services program, not a DSV or
#     housing provider.
#   - Coquille Valley Hospital (Coquille), Southern Coos Hospital & Health
#     Center (Bandon), Myrtle Point Health District, Powers Health District:
#     in-county hospital districts, but no obstetric, birth or prenatal service
#     could be confirmed at any of them, so none is recorded under
#     maternal health. Bay Clinic's own NEST page states that "nearly all
#     regional births occur at Bay Area Hospital".
#   - Food banks (South Coast Food Share, Coos Food Cupboard, The Ark) and
#     Habitat for Humanity ReStore: out of topic.

organizations:
  # Sources: thesafeproject.net (own pages: homepage, staff, donate), the
  # OCADSV member directory, and the Coos County District Attorney's domestic
  # violence page. All three agree on the 24-hour crisis line (541) 756-7000;
  # the own site and the OCADSV/DomesticShelters listings agree on the Newmark
  # Ave outreach office and the (541) 888-1048 business line. The emergency
  # shelters (Cloe House, Jane's House) are confidential, so only the outreach
  # office address is recorded. The email below is the address the organization
  # publishes for general inquiries on its own sites.
  # The mission below is the organization's own statement of purpose from its
  # homepage; without it the extractor picked up the site footer
  # ("(c)2023 The Safe Project | Powered by Epuerto").
  - name: "The SAFE Project"
    aka: ["SAFE Project", "S.A.F.E. Project", "Women's Safety and Resource Center"]
    website: "https://thesafeproject.net"
    address: "1681 Newmark Ave, Coos Bay, OR 97420"
    phone: "(541) 888-1048"
    email: "rachael@thesafeproject.net"
    city: "Coos Bay"
    county: "Coos"
    topics: ["dsv"]
    org_type: "nonprofit"
    keywords: ["domestic violence", "sexual assault", "emergency shelter", "confidential advocacy", "crisis line", "support groups", "legal advocacy"]
    mission: >-
      The SAFE Project is dedicated to eliminating violence. To accomplish
      this, clients must be empowered to make free decisions concerning all
      aspects of their lives.
    notes: >-
      Coos County's confidential domestic and sexual violence advocacy agency,
      providing a 24-hour crisis line at (541) 756-7000, a 24-hour crisis
      response team, emergency shelter, support groups, legal advocacy and
      prevention education. It also serves Curry County; the Coos services are
      delivered from its Coos Bay outreach office.
    verification_status: "web_verified"

