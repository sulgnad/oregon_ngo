  # Sources: bayareahospital.org (Family Birth Center and about pages), the
  # Oregon Health Authority hospital reporting page, and the hospital's own
  # audited financial statements and board packets.
  # org_type: the hospital is operated by the Bay Area Health District, which
  # its own bylaws describe as "a political subdivision and municipal
  # corporation of the State of Oregon ... created pursuant to ORS 440.305",
  # governed by a publicly elected six-member board, so it is recorded as
  # government. Note that a 2026 OHA material-change filing by the district
  # describes itself instead as "a 501(c)(3) hospital district"; the two
  # descriptions are not reconciled in the public record.
  # The website is pinned to the Family Birth Center page because the hospital
  # home page is a marketing banner.
  # SERVICE CHANGE: the hospital discontinued its MOMS (Management of Maternity
  # Services) program, including postpartum at-home visits, on 2025-02-09, and
  # closed its Bright Beginnings childcare center on 2025-02-28. Childbirth
  # classes, lactation consultation and post-discharge planning continue.
  # The mission below is the opening sentence of the hospital's own Family
  # Birth Center page. Without it the extractor returned the home page banner
  # ("...comprehensive provider of health & well-being... Learn more.").
  - name: "Bay Area Hospital"
    aka: ["Bay Area Health District", "Bay Area Hospital District", "Bay Area Hospital Family Birth Center"]
    website: "https://bayareahospital.org/care-services/family-birth-center/"
    address: "1775 Thompson Rd, Coos Bay, OR 97420"
    phone: "(541) 269-8111"
    city: "Coos Bay"
    county: "Coos"
    topics: ["maternal_health"]
    org_type: "government"
    keywords: ["labor and delivery", "postpartum care", "newborn care", "lactation support", "childbirth education", "obstetric triage"]
    mission: >-
      Our labor, delivery, and postpartum unit is dedicated to providing a
      safe, supportive, and family-centered birth experience.
    notes: >-
      The largest hospital on Oregon's south coast and the region's only birth
      center. Its Family Birth Center provides labor, delivery and postpartum
      care in seven birth rooms, prenatal testing and obstetric triage,
      cesarean surgery, newborn care, lactation consultation, free childbirth
      education classes and postpartum follow-up.
    verification_status: "web_verified"

