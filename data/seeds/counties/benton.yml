# Hand-curated organizations for the Benton County collection.
#
# Researched 2026-10-12. Topics are limited to DSV, housing and maternal health.
#
# `notes` is used as the Services_Summary / Org_Agency_Bio fallback when no
# mission can be extracted, so it must read as a public description of the
# organization. Research caveats and provenance live in YAML comments instead.
#
# verification_status values used here:
#   web_verified  name, website and contact details were each confirmed against
#                 at least two independent public sources (the org's own site,
#                 IRS filings, local news, or a state/benefit directory).
#   unverified    included, but at least one material fact rests on a single
#                 source or could not be confirmed; see the comment above the
#                 entry.
#
# Fields are omitted rather than guessed. Where a regional agency is included,
# the address and phone are the Benton County office, not headquarters.
#
# Considered and deliberately excluded:
#   - Community Health Centers of Benton and Linn Counties (the county-run
#     FQHC, clinics.bentoncountyor.gov): its own Family Planning page states
#     "We do not provide traditional pregnancy/maternity care", and none of the
#     five clinics list prenatal or maternity services. Out of topic.
#   - Samaritan Obstetrics, Gynecology & Midwifery (3640 NW Samaritan Dr Ste
#     220, Corvallis; 541-768-5300): a real Benton prenatal provider, but it
#     shares the samhealth.org host with Good Samaritan Regional Medical Center
#     below, and the pipeline's host-based dedup would silently collapse the two
#     into one row. Only the hospital (the actual birth site) is listed.
#   - Corvallis Birth Center (2235 NW Kings Blvd Ste A): freestanding birth
#     centre, but it could not be confirmed as a nonprofit or public body, and
#     org_type has no for-profit value.
#   - Sarah's Place, the regional sexual assault nurse examiner centre CARDV
#     and OSU both refer survivors to: it is at Samaritan Albany General
#     Hospital in Linn County, with no Benton office.
#   - ABC House (child abuse assessment, Albany) and Old Mill Center for
#     Children and Families / Pollywog (Corvallis): child-abuse and early
#     childhood work, out of topic.
#   - Vina Moses Center, South Corvallis Food Bank, Philomath Community
#     Services, Stone Soup: free goods and food, out of topic.
#   - Corvallis Caring Place and Samaritan Village: senior assisted living and
#     senior HUD housing, not homelessness or affordable-housing services.
#   - Planned Parenthood Columbia Willamette's Corvallis health centre:
#     reproductive health, but no prenatal or maternity care is advertised.
#   - Benton County Crisis Center and Milestones Family Recovery: behavioural
#     health and addiction treatment.
#   - Linn Benton Food Share, Emergence, Legal Aid Services of Oregon (Albany
#     regional office, no Benton office).

organizations:
  # Sources: cardv.org (contact page, rack card) and Charity Navigator
  # (EIN 93-0792125), which agree on 2208 SW 3rd St and 541-758-0219.
  # An older Community Services Consortium resource guide and an archived OSU
  # brochure still list an administrative office at 4786 SW Philomath Blvd;
  # that address is stale. CARDV's two shelters are at confidential locations.
  # 24-hour crisis and support line: (541) 754-0110 / (800) 927-0197.
  # Without a seeded mission the extractor picks up the site's listing blurb,
  # which opens with the crisis-line number; the mission below is CARDV's own
  # statement from its History & Mission page.
  - name: "Center Against Rape and Domestic Violence"
    aka: ["CARDV"]
    website: "https://cardv.org"
    ein: "930792125"
    address: "2208 SW 3rd St, Corvallis, OR 97333"
    phone: "(541) 758-0219"
    email: "info@cardv.org"
    city: "Corvallis"
    county: "Benton"
    topics: ["dsv"]
    org_type: "nonprofit"
    keywords: ["domestic violence", "sexual assault", "stalking", "sex trafficking", "emergency shelter", "legal advocacy", "crisis line", "support groups"]
    mission: >-
      The mission of the Center Against Rape and Domestic Violence is twofold:
      to provide services and support to those affected by sexual and domestic
      violence, and to provide education and leadership within the community to
      change the societal conditions that cultivate these forms of violence.
    notes: >-
      Benton County's confidential domestic and sexual violence advocacy
      agency, serving Linn and Benton counties since 1981. Runs a 24-hour
      crisis and support line at (541) 754-0110, two confidential emergency
      shelters, legal and medical advocacy, support groups and community
      education.
    verification_status: "web_verified"

