  # Sources: cape.oregonstate.edu, OSU's central incident-reporting page and the
  # Counseling & Psychological Services crisis page, which agree on
  # 541-737-2030 and survivoradvocacy@oregonstate.edu.
  # NAME CHANGE: this service was the Survivor Advocacy and Resource Center
  # (SARC) in Plageman 311; it is now the Center for Advocacy, Prevention &
  # Education in Student Experience Center 350. Older OSU PDFs still say SARC.
  # The ZIP below is the OSU Corvallis campus ZIP; CAPE's own page gives the
  # street address without one.
  # A university is a public body, so org_type is "government". OSU is a state
  # university, so agency_level is State rather than the County default.
  # The homepage leads with a crisis-line banner, so the mission is seeded from
  # CAPE's own "who we are" paragraph on that page.
  - name: "Oregon State University Center for Advocacy, Prevention & Education"
    aka: ["CAPE", "OSU Survivor Advocacy and Resource Center", "SARC"]
    website: "https://cape.oregonstate.edu"
    address: "Student Experience Center 350, 2251 SW Jefferson Way, Corvallis, OR 97331"
    phone: "(541) 737-2030"
    email: "survivoradvocacy@oregonstate.edu"
    city: "Corvallis"
    county: "Benton"
    topics: ["dsv"]
    org_type: "government"
    agency_level: "State"
    keywords: ["survivor advocacy", "gender-based violence", "sexual assault", "dating violence", "stalking", "safety planning", "medical advocacy", "prevention education"]
    mission: >-
      The Center for Advocacy, Prevention & Education (CAPE) cultivates a
      survivor-centered, trauma informed, culture of consent. We aim to create
      lasting social change and eliminate gender based violence through shared
      goals of comprehensive sexual health education, action-oriented
      prevention and compassionate survivor support.
    notes: >-
      Oregon State University's confidential advocacy service for survivors of
      interpersonal and gender-based violence, free to students, staff, faculty,
      alumni and anyone affected by a member of the OSU community. Provides
      safety planning, medical and legal accompaniment, academic and housing
      accommodations, a survivor fund, support groups and prevention education.
    verification_status: "web_verified"

