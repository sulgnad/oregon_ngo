  # Sources: unityshelter.org and the United Way of Linn, Benton & Lincoln
  # agency directory (both give 4515 SW West Hills Rd); IRS EIN 84-5104870.
  # SERVICE HISTORY: Unity announced in May 2025 that funding losses would
  # suspend the Men's Shelter, Room at the Inn and the Emergency Hotel Shelter
  # from July 1 and cut about 80% of staff (Corvallis Gazette-Times / OregonLive,
  # 11-12 May 2025). A combined shelter ran at Room at the Inn over the summer;
  # the Men's Shelter reopened at Chapman Center on 9 December 2025, restoring
  # 50 beds. Per Benton County's Coordinated Homeless Response Office (August
  # 2026), the Emergency Hotel Shelter is funded only through October 2026 and
  # the two congregate shelters only through March 2027.
  # Programme sites: Room at the Inn 1166 NW Jackson Ave (541-207-4636), Men's
  # Shelter and Hygiene Center 211 SE Chapman Pl (541-250-5113), SafePlace
  # microshelters at scattered sites (541-730-3013). The address below is the
  # administrative office.
  # The homepage leads with the banner "Transforming Lives", so the mission is
  # seeded from Unity's own agency profile wording.
  - name: "Unity Shelter"
    website: "https://unityshelter.org"
    ein: "845104870"
    address: "4515 SW West Hills Rd, Corvallis, OR 97333"
    phone: "(541) 286-5121"
    email: "info@unityshelter.org"
    city: "Corvallis"
    county: "Benton"
    topics: ["housing"]
    org_type: "nonprofit"
    keywords: ["emergency shelter", "low-barrier shelter", "transitional housing", "microshelters", "hygiene center", "Room at the Inn", "SafePlace"]
    mission: >-
      Unity Shelter's mission is to provide safe shelter through community
      care.
    notes: >-
      The largest low-barrier shelter provider in Benton County, formed in 2020
      as an umbrella for Room at the Inn, the Corvallis Men's Shelter and
      SafePlace. Operates emergency overnight shelter for women and for men,
      SafePlace transitional microshelters, and a Hygiene Center offering
      showers, laundry, meals, mail and basic needs seven days a week.
    verification_status: "web_verified"

