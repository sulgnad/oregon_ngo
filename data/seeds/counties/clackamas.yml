# Hand-curated organizations for the Clackamas County collection.
#
# Researched 2026-10-12. Topics are limited to DSV, housing and maternal health.
#
# `notes` is used as the Services_Summary / Org_Agency_Bio fallback when no
# mission can be extracted, so it must read as a public description of the
# organization. Research caveats and provenance live in YAML comments instead.
#
# verification_status values used here:
#   web_verified  name, website and contact details were each confirmed against
#                 at least two independent public sources (the org's own site,
#                 IRS/Charity Navigator, local news, a state directory such as
#                 OCADSV, the Oregon DOJ county victim-assistance directory, the
#                 OHA WIC clinic directory, CMS/OHA hospital records, or county
#                 contract documents published on dochub.clackamas.us).
#   unverified    included, but at least one material fact rests on a single
#                 source or could not be confirmed; see the comment above the
#                 entry.
#
# Fields are omitted rather than guessed.
#
# Clackamas County is the third most populous county in Oregon, so this list is
# deliberately capped and weighted toward the core providers: the confidential
# DSV advocacy agency, the family justice center, the DA victim assistance
# program, the housing authority, the community action agency, the county's only
# whole-family shelter, the main shelter/housing contractors, county public
# health (WIC and nurse home visiting), the county FQHC, and the two hospitals
# that deliver babies in the county.
#
# Considered and deliberately excluded:
#   - Clackamas Service Center (cscoregon.org): a major North Clackamas basic
#     needs provider, but its only site is 8800 SE 80th Ave, Portland (Multnomah
#     County), so it fails the physical-office rule. Its own contact page also
#     said "Our phone line is currently down" when checked, and it has warned
#     publicly (Sept 2025) that its Food Hub may close.
#   - To:gether Canby (formerly The Canby Center, 681 SW 2nd Ave, Canby): a real
#     Clackamas nonprofit, but it is classified as a food bank (NTEE K31) and its
#     rent/utility assistance was only 14 cases and $4,950 in 2023. Out of topic.
#     Note the name change took effect May 15, 2026.
#   - Clackamas County Children's Commission / Healthy Families of Clackamas
#     County: the county's only certified Healthy Families Oregon home-visiting
#     provider, but predominantly a Head Start and child-abuse-prevention agency.
#   - Homeless Solutions Coalition of Clackamas County (hsccc.org): a coalition
#     that states it does not provide direct service; it is building the Caring
#     Place resource center in Oregon City.
#   - Clackamas County Behavioral Health, Clackamas Workforce Partnership,
#     Metropolitan Family Services, Oregon Child Development Coalition: out of
#     the three topics.
#   - El Programa Hispano Catolico (UNICA) and Legacy Mount Hood Medical Center
#     serve Clackamas residents but are based in Gresham (Multnomah County).
#   - Legacy Meridian Park Medical Center is in Tualatin (Washington County).

organizations:
  # Sources: cwsor.org (own pages, Tax ID 93-0900119), the county's domestic
  # violence response page, and CWS's own 2024 legislative testimony on HB 4140.
  # The mission below is CWS's own wording; the scraper would otherwise pick up
  # the site-wide "Safety Alert!" banner that sits above the page content.
  # CWS is co-located at A Safe Place Family Justice Center and shares that
  # building's address and main phone; the 24-hour crisis line is separate.
  - name: "Clackamas Women's Services"
    aka: ["CWS"]
    website: "https://www.cwsor.org"
    ein: "930900119"
    address: "256 Warner Milne Rd, Oregon City, OR 97045"
    phone: "(503) 655-8600"
    email: "info@cwsor.org"
    city: "Oregon City"
    county: "Clackamas"
    topics: ["dsv", "housing"]
    org_type: "nonprofit"
    keywords: ["domestic violence", "sexual assault", "stalking", "elder abuse", "trafficking", "emergency shelter", "confidential advocacy", "crisis line", "Latinx services", "Camp HOPE"]
    mission: >-
      The mission of Clackamas Women's Services is to break the isolation of
      domestic and sexual violence.
    notes: >-
      Clackamas County's confidential domestic and sexual violence advocacy
      agency, incorporated in 1985. Provides a 24-hour crisis and support line
      at (503) 654-2288, The Village emergency shelter, rapid rehousing and
      survivor housing programs, counseling and support groups, children's and
      youth advocacy, Latina/x Promotoras outreach, legal advocacy and school
      based prevention education.
    verification_status: "web_verified"

  # Sources: asafeplacefjc.org (own pages) and the county's "Responding to
  # Domestic Violence" page, which both give the same address and phone.
  # The center is a county-led multi-agency collaborative operated with CWS: its
  # director and program coordinator use @clackamas.us addresses, so it is
  # recorded as government. No single published org-wide email exists (the
  # contact page lists individual staff and the CWS reception address), so the
  # email is omitted. The address and main phone are intentionally the same as
  # the CWS entry above because CWS is housed inside this building.
  # The mission below is the county's description of the center; the center's own
  # site is mostly a contact and services list with no mission statement.
  - name: "A Safe Place Family Justice Center"
    aka: ["A Safe Place", "Clackamas County Family Justice Center", "ASP", "FJC"]
    website: "https://asafeplacefjc.org"
    address: "256 Warner Milne Rd, Oregon City, OR 97045"
    phone: "(503) 655-8600"
    city: "Oregon City"
    county: "Clackamas"
    topics: ["dsv"]
    org_type: "government"
    keywords: ["family justice center", "protective orders", "restraining orders", "safety planning", "elder abuse", "co-located services", "legal assistance"]
    mission: >-
      Founded in 2013, A Safe Place Family Justice Center brings multiple
      agencies together under one roof to provide trauma-informed, coordinated
      support.
    notes: >-
      Clackamas County's family justice center, where survivors of domestic
      violence, sexual violence, stalking and abuse of older adults can reach
      advocacy, legal help, law enforcement and housing resources in a single
      visit. Runs a weekday protection-order clinic with an on-site video
      courtroom and hosts support groups.
    verification_status: "web_verified"

