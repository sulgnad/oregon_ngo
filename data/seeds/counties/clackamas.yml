      homelessness in Oregon City and the surrounding area. Runs a day resource
      center with meals, showers and a clothing exchange, serves as the area's
      emergency warming shelter in freezing weather and a cooling and smoke
      refuge in summer, and operates a hotel-based transitional housing program,
      housing navigation, rapid rehousing and supportive housing case management
      under contract with Clackamas County. Shelter referrals come through
      Clackamas County Coordinated Housing Access.
    verification_status: "unverified"

