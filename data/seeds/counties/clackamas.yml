    mission: >-
      Sunnyside Medical Center is home to labor and delivery with a Level III
      Neonatal Intensive Care Unit, the Northwest Center for Heart and Vascular
      Care, and regional centers for adult cancer care and for neurosurgery and
      neuro-intervention.
    notes: >-
      Not-for-profit general hospital in the Sunnyside area of Clackamas County,
      open since 1975 and licensed for more than 300 beds. It is one of two
      hospitals in Clackamas County that deliver babies, with labor and delivery,
      a Level III neonatal intensive care unit and on-site perinatology.
      Prenatal care is provided at the adjacent Mt. Talbert and Sunnyside medical
      offices, and the hospital offers CenteringPregnancy group prenatal care and
      Project Nurture, which combines maternity care with substance use
      treatment.
