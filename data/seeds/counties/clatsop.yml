# Hand-curated organizations for the Clatsop County collection.
#
# Researched 2026-10-12. Topics are limited to DSV, housing and maternal health.
#
# `notes` is used as the Services_Summary / Org_Agency_Bio fallback when no
# mission can be extracted, so it must read as a public description of the
# organization. Research caveats and provenance live in YAML comments instead.
#
# verification_status values used here:
#   web_verified  name, website and contact details were each confirmed against
#                 at least two independent public sources (the org's own site,
#                 IRS/charity records, local news, a county or state directory).
#   unverified    included, but at least one material fact rests on a single
#                 source or could not be confirmed; see the comment above the
#                 entry.
#
# Fields are omitted rather than guessed.
#
# Considered and deliberately excluded:
#   - Clatsop Behavioral Healthcare (Warrenton/Astoria/Seaside): community
#     mental health and substance use provider. It owns permanent supportive
#     and recovery housing, but housing is a side program of a treatment
#     agency, not its purpose.
#   - Consejo Hispano (Astoria): culturally specific Latinx services —
#     education, tax and digital literacy, legal navigation, crisis referral.
#     It hosted Astoria's emergency cold-weather shelter at Casa Mariposa
#     (565 12th St) in winter 2026, but the shelter is operated by Clatsop
#     Community Action; Consejo is not itself a DSV, housing or maternal
#     health provider.
#   - Coastal Family Health Center (2275 Commercial St, Astoria): the county's
#     FQHC, operated by Yakima Valley Farm Workers Clinic, which moved into a
#     new building in January 2026. YVFWC offers obstetrics system-wide, but
#     the Astoria clinic's published service list is family medicine, dental,
#     behavioral health, nutrition and pharmacy with no prenatal or obstetric
#     line, so it is not recorded under maternal health.
#   - Lighthouse for Kids (Astoria): children's advocacy center / child abuse
#     assessment.
#   - Coast Pregnancy Clinic (Astoria): faith-based pregnancy counselling
#     centre, not a maternity care provider.
#   - Community Action Team (CAT, headquartered in St. Helens): delivers
#     energy, weatherization and home-ownership programs in Clatsop County,
#     but its Clatsop energy assistance is intaken through Clatsop Community
#     Action, and the only Clatsop address on CAT's own site (Regional Housing
#     Center, 1154 Commercial St, Astoria) is on a page that still describes
#     the office as closed for COVID-19. Third-party directories give two more
#     Astoria addresses (818 Commercial St Ste 203 and 1010 Duane St Ste 204)
#     and two phone numbers. No staffed Clatsop office could be confirmed, so
#     it is not recorded here. CAT is already carried under Tillamook in
#     data/seeds/jefferson_tillamook.yml.
#   - Chinook Indian Nation and the Clatsop-Nehalem Confederated Tribes: no
#     DSV, housing or maternal health program with a Clatsop County office
#     could be confirmed; the Chinook Indian Nation is headquartered in Bay
#     Center, Washington.

organizations:
  # Sources: harbornw.org and The Astorian / KMUN, July-October 2026; EIN from
  # the organization's Candid/GuideStar profile (93-0691750).
  # MOVED: The Harbor bought the former Astorian building and opened advocacy
  # services at 949 Exchange St on October 1, 2026 (The Astorian 2026-09-30 and
  # the organization's own 2026-10-04 announcement). The site footer and the
  # county's resource page still show the old 801 Commercial St address; the
  # new address is recorded here. The confidential shelter is at an
  # undisclosed location, as is standard for DSV programs.
  - name: "The Harbor"
    aka: ["The Harbor, Inc.", "Harbor NW", "Women's Resource Center"]
    website: "https://www.harbornw.org"
    ein: "930691750"
    address: "949 Exchange St, Astoria, OR 97103"
    phone: "(503) 325-3426"
    email: "info@harbornw.org"
    city: "Astoria"
    county: "Clatsop"
    topics: ["dsv"]
    org_type: "nonprofit"
    keywords: ["domestic violence", "sexual assault", "stalking", "confidential shelter", "advocacy", "crisis line", "Latinx services", "prevention education"]
    notes: >-
      Clatsop County's confidential domestic and sexual violence advocacy
      centre, serving the county since 1976. Free and confidential services
      include a 24-hour support line at (503) 325-5735 (Spanish
      1-855-938-0584), confidential emergency shelter, safety planning,
      medical and legal advocacy, support groups, housing navigation,
      culturally specific Latinx services and school-based violence
      prevention education.
    verification_status: "web_verified"

