  - name: "Astoria Birth Center & Family Medicine"
    aka: ["Astoria Birth Center", "Astoria Birth Center and Women's Health"]
    website: "https://www.astoriabirthcenter.com"
    address: "1406 Marine Dr, Astoria, OR 97103"
    phone: "(503) 468-0650"
    email: "office@astoriabirthcenter.com"
    city: "Astoria"
    county: "Clatsop"
    topics: ["maternal_health"]
    keywords: ["freestanding birth center", "midwifery", "certified nurse midwives", "prenatal care", "postpartum care", "lactation", "waterbirth", "gynecology"]
    mission: >-
      Astoria's first freestanding birth and primary care center. Certified
      Nurse Midwives provide prenatal, birth, postpartum, and women's health
