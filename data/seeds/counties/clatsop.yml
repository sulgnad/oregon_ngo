  # Sources: ccaservices.org and the City of Astoria's homelessness FAQ and
  # Clatsop Behavioral Healthcare's 2026 resource listing, which agree on
  # 364 9th St and (503) 325-1400.
  # CCA runs the 58-bed Columbia Inn shelter in Astoria (referral only),
  # Esperanza Village transitional tiny homes in Seaside, the Regional Food
  # Bank in Warrenton (2010 SE Chokeberry Ave) and the city's seasonal
  # emergency cold-weather shelter. It received the largest county shelter
  # allocation in the 2026-27 funding formula ($710,620).
  - name: "Clatsop Community Action"
    aka: ["CCA", "Clatsop Community Action Inc"]
    website: "https://ccaservices.org"
    address: "364 9th St, Astoria, OR 97103"
    phone: "(503) 325-1400"
    city: "Astoria"
    county: "Clatsop"
    topics: ["housing"]
    org_type: "nonprofit"
    keywords: ["community action", "emergency shelter", "transitional housing", "rental assistance", "energy assistance", "coordinated entry", "veterans housing", "street outreach"]
    notes: >-
      Clatsop County's community action agency and its largest housing
      provider. Services include emergency and transitional shelter, rental
      and deposit assistance, coordinated entry assessments, case management,
      street outreach, veterans housing assistance, energy assistance and a
      regional food bank.
    verification_status: "web_verified"

  # Sources: lifeboat-services.org / fillingemptybellies.org, the City of
  # Astoria homelessness FAQ, and Clatsop Behavioral Healthcare's 2026
