    website: "https://www.columbiamemorial.org/services/family-birth-center/"
    address: "2111 Exchange St, Astoria, OR 97103"
    phone: "(503) 338-7581"
    city: "Astoria"
    county: "Clatsop"
    topics: ["maternal_health"]
    org_type: "nonprofit"
    keywords: ["labor and delivery", "family birth center", "obstetrics", "certified nurse midwives", "prenatal care", "postpartum care", "pediatrics"]
    mission: >-
      At the CMH Family Birth Center and the CMH-OHSU Health Obstetrics &
      Gynecology Clinic, we are your partners in pregnancy, from prenatal care
