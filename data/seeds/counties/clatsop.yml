    website: "https://www.lifeboat-services.org"
    ein: "823838234"
    address: "1040 Commercial St, Astoria, OR 97103"
    phone: "(503) 468-8176"
    city: "Astoria"
    county: "Clatsop"
    topics: ["housing"]
    org_type: "nonprofit"
    keywords: ["low-barrier shelter", "houselessness", "meals", "showers", "laundry", "housing navigation", "peer support", "street outreach"]
    mission: >-
      Astoria nonprofit serving people experiencing homelessness through its
      Filling Empty Bellies program: daytime navigation services, meals,
      showers, laundry, a clothing closet, peer support and housing advocacy.
      It ran Clatsop County's only walk-in, low-barrier overnight shelter
      until July 2026.
    notes: >-
      Astoria nonprofit serving people experiencing homelessness through its
      Filling Empty Bellies program: daytime navigation services, meals,
      showers, laundry, a clothing closet, peer support and housing advocacy.
      It ran Clatsop County's only walk-in, low-barrier overnight shelter
      until July 2026.
