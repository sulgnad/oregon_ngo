      Oregon Health Plan for birth and women's health services.
    verification_status: "web_verified"

  # Sources: providence.org (Seaside hospital pages), Providence's August 2025
  # service-closure announcement, and OPB / The Astorian / OregonLive coverage
  # of the closure.
  # STATUS: inpatient obstetric and newborn services — labor and delivery,
  # well-newborn care and outpatient prenatal and gynecological surgery with
  # an OB/GYN — closed on October 4, 2025. Two family medicine providers with
  # obstetrics training continue to provide prenatal care, and the emergency
  # department still receives obstetric patients; deliveries now go to
  # Columbia Memorial Hospital or the Astoria Birth Center. The export's
  # Operations_Status column is a constant and does not reflect this.
  # A mission is seeded because providence.org otherwise yields the national
  # health system's boilerplate mission statement; the text below is
  # Providence Seaside's own description of this hospital.
  - name: "Providence Seaside Hospital"
    aka: ["Providence Seaside"]
    website: "https://www.providence.org/locations/or/seaside-hospital"
    address: "725 S Wahanna Rd, Seaside, OR 97138"
    phone: "(503) 717-7000"
    city: "Seaside"
    county: "Clatsop"
    topics: ["maternal_health"]
    org_type: "nonprofit"
    keywords: ["critical access hospital", "prenatal care", "family medicine obstetrics", "emergency medicine", "south county"]
    mission: >-
      Providence Seaside Hospital is a 25-bed critical access hospital with
      full accreditation by the Joint Commission that offers primary and
      specialty care, general surgery, radiology, diagnostic imaging,
      pathology and emergency medicine 24 hours a day.
    notes: >-
      Critical access hospital serving south Clatsop County, with clinics in
      Seaside, Warrenton and Cannon Beach. Since its inpatient maternity unit
      closed in October 2025 it provides prenatal care through family medicine
      providers with obstetrics training, and its emergency department remains
      prepared for obstetric patients; births take place in Astoria.
    verification_status: "web_verified"
