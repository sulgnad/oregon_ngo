  # after the county cut its allocation to roughly $112,000 (The Astorian,
  # OPB, KOIN, June-August 2026). Daytime services and meals continue;
  # Helping Hands and CCA's Columbia Inn absorbed the 22 low-barrier beds.
  # The export's Operations_Status column is a constant ("Normal operations")
  # and does not reflect this. The city's FAQ lists (503) 741-3572 and
