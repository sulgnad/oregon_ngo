# Hand-curated organizations for the Jefferson / Tillamook county collection.
#
# These are orgs that the automated statewide sources either miss entirely or
# list without enough location detail to survive county scoping. Tribal and
# county-government programs are included deliberately: in both counties they
# are frequently the *only* provider for a topic. They carry an explicit
# `org_type` so they are not de-duplicated against each other by shared
# website host (see discovery/base.py).
#
# `verification_status: unverified` means the website was inferred and has not
# been confirmed by a human. The pipeline will still crawl it; treat the
# resulting mission text as provisional until checked.
#
# Websites are pinned here on purpose. Left to search-engine resolution, small
# rural orgs resolve to charity-data and shelter-directory sites instead of
# their own domain, and the crawler then records the *directory's* phone and
# address. Each URL below was confirmed to serve a page belonging to the named
# organization. Where no trustworthy domain was found the field is omitted
# rather than guessed:
#   - Madras Gospel Mission: madrasgospelmission.org is no longer controlled by
#     the mission and now serves unrelated spam. Needs a manual URL.
#   - Jefferson County Faith Based Network, Rinehart Clinic and Community
#     Action Team: no confirmable homepage at time of collection.

organizations:
  # ---------------------------------------------------------------- Jefferson
  - name: "Warm Springs Victims of Crime Services"
    aka: ["Warm Springs VOCS", "Victims of Crime Services Program"]
    website: "https://warmsprings-nsn.gov"
    city: "Warm Springs"
    county: "Jefferson"
    topics: ["dsv"]
    org_type: "tribal_government"
    keywords: ["domestic violence", "sexual assault", "advocacy", "tribal"]
    notes: >-
      Confederated Tribes of Warm Springs program serving the reservation.
      Primary DSV provider for the Warm Springs community.
    verification_status: "unverified"

  - name: "Warm Springs Housing Authority"
